- name: Ensure s1-monitor directory exists
  file:
    path: "{{ s1_monitor_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy application source
  copy:
    src: "{{ item.src }}"
    dest: "{{ s1_monitor_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: Dockerfile, dest: Dockerfile }
    - { src: app/, dest: app/ }
  notify: restart s1-monitor

- name: Render docker-compose file
  template:
    src: docker-compose.s1_monitor.yml.j2
    dest: "{{ s1_monitor_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: restart s1-monitor

- name: Build and start s1-monitor container
  command: docker compose up -d --build
  args:
    chdir: "{{ s1_monitor_dir }}"
  register: s1_monitor_compose
  changed_when: "'Started' in s1_monitor_compose.stdout or 'Recreated' in s1_monitor_compose.stdout"
