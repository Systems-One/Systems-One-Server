ansible_connection: local

cloudflare_tunnel_token: "{{ vault_cloudflare_tunnel_token }}"
# Matches the live container (confirmed via docker inspect) — cloudflared runs in
# host network mode here, so tunnel-routed services must publish a host port
# (127.0.0.1:<port>) rather than rely on the infra bridge network's container DNS.
cloudflared_network_mode: host

# MQTT
mqtt_username: "{{ vault_mqtt_username }}"
mqtt_password: "{{ vault_mqtt_password }}"

# MSSQL
mssql_sa_password: "{{ vault_mssql_sa_password }}"

# s1_reporter chart hosting (Teams notifications) — see Task 9 for Cloudflare DNS setup
s1_reporter_chart_public_base_url: "https://charts.sysone.co.za"

# Offsite backup (Backblaze B2) — see roles/backup. backup_enabled itself is
# a shared default in group_vars/all.yml; flip it here once Step 1's vault
# vars are populated and you've verified {{ backup_script_path }} runs clean.
backup_b2_account_id: "{{ vault_backup_b2_account_id }}"
backup_b2_account_key: "{{ vault_backup_b2_account_key }}"
backup_restic_password: "{{ vault_backup_restic_password }}"
backup_b2_path: "sysone"

# scan_fleet_dashboard's default port (8091) collides with s1_reporter's
# chart-hosting port, which already owns 8091 in production (see
# s1_reporter_chart_public_base_url above). First deploy of this role to
# sysone surfaced the clash -- give it a distinct port instead.
scan_fleet_dashboard_port: 8092

# s1_monitor runs on 8093 until the cutover PR retires marketing_display and frees 8090.
s1_monitor_port: 8093

# Relay PPNAM Station 1 label jobs over Tailscale to the office TSC ML241P
# (Station 1 printer setting: 100.102.46.89 port 9100).
printer_relay_enabled: true

# s1_dash is public at dash.sysone.co.za through the Cloudflare tunnel to localhost:3000.
# It listens on the port Grafana used, so the existing Cloudflare route needed no change.
s1_dash_port: 3000
s1_dash_session_secret: "{{ vault_s1_dash_session_secret }}"
s1_dash_ghcr_user: "Systems-One"
s1_dash_ghcr_token: "{{ vault_s1_dash_ghcr_token }}"
s1_dash_users:
  - login: "jonathan"
    role: "admin"
    password: "{{ vault_grafana_jonathan_password }}"
